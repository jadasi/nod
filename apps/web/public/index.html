<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="robots" content="noindex" />
    <title>Nod</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Nod</h1>
      <nav id="tabs" hidden>
        <button data-tab="inbox" class="active">
          Inbox <span id="count-inbox" class="count"></span>
        </button>
        <button data-tab="repair">
          Stale &amp; conflicts <span id="count-repair" class="count"></span>
        </button>
        <button data-tab="updates">Updates</button>
      </nav>
      <span id="conn" class="conn" title="Live connection"></span>
    </header>
    <div id="mode" class="mode" hidden></div>
    <main id="view"></main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
